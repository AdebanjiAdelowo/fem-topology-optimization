# Fast smoke-test configuration: coarse meshes, few iterations, small
# sweeps. Intended to check that every script runs end-to-end, NOT to
# produce publication-quality results.

canonical:
  nx: 20
  ny: 10
  L: 2.0
  H: 1.0
  E0: 1.0
  Emin: 1.0e-9
  nu: 0.3
  p: 3.0
  Vf: 0.4
  r_min: 0.15
  move: 0.2
  max_iter: 30
  change_tol: 1.0e-3

mesh_study:
  resolutions: [[10, 5], [20, 10]]
  L: 2.0
  H: 1.0
  Vf: 0.4
  p: 3.0
  r_min_per_h: 3.0
  max_iter: 30
  change_tol: 1.0e-3

volume_fraction_study:
  nx: 20
  ny: 10
  L: 2.0
  H: 1.0
  p: 3.0
  r_min: 0.15
  volume_fractions: [0.3, 0.5]
  max_iter: 30
  change_tol: 1.0e-3

penalization_study:
  nx: 20
  ny: 10
  L: 2.0
  H: 1.0
  Vf: 0.4
  r_min: 0.15
  penalizations: [1.0, 3.0]
  max_iter: 30
  change_tol: 1.0e-3

filter_radius_study:
  nx: 20
  ny: 10
  L: 2.0
  H: 1.0
  Vf: 0.4
  p: 3.0
  filter_radii: [0.08, 0.2]
  max_iter: 30
  change_tol: 1.0e-3

sensitivity_taylor:
  nx: 6
  ny: 3
  L: 2.0
  H: 1.0
  Vf: 0.4
  p: 3.0
  r_min: 0.1
