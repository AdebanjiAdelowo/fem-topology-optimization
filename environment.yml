# FEniCSx + PETSc, installed via conda-forge (the officially supported route
# on Apple Silicon; pip wheels for dolfinx are not reliably available for
# macOS/arm64). Reuses the same "fenicsx" conda environment built for the
# companion `fem-cylinder-flow` and `darcy-inverse-problem` projects, but this
# repository is independently reproducible from this file alone: it uses only
# dolfinx's built-in `create_rectangle` (no gmsh mesh generation), so
# gmsh/python-gmsh/pyvista below are not strictly required by anything in
# src/ or scripts/, kept only for environment parity.
#
#   conda env create -f environment.yml
#   conda activate fenicsx
#
# Exact versions actually installed and used for every result in this
# repository (see results/environment_versions.txt for the full pinned list):
#   fenics-dolfinx 0.10.0, petsc4py 3.24.3, mpich 4.3.2, python 3.12.12
name: fenicsx
channels:
  - conda-forge
dependencies:
  - python=3.12
  - fenics-dolfinx
  - mpich
  - petsc4py
  - gmsh
  - python-gmsh
  - pyvista
  - numpy
  - scipy
  - matplotlib
  - pytest
  - pyyaml
